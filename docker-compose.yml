version: "3.9"

services:
  # ── Application ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idx-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info

  # ── Telegram Bot (runs as separate process) ───────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idx-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - app
      - postgres
      - redis
    command: python -m app.bot.telegram_bot

  # ── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: idx-ai-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: idx_ai
      POSTGRES_USER: idx_ai_user
      POSTGRES_PASSWORD: change_me_in_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idx_ai_user -d idx_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: idx-ai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
